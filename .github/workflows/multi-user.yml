name: Multi-user integration

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  CLASHCTL_SYSTEM_PREFIX: /opt/clashctl-test

jobs:
  multi-user:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure deterministic dependency downloads
        run: |
          sed -i 's/^GH_PROXY=.*/GH_PROXY=/' .env.install
          sed -i 's/^CLASHCTL_CHECK_LATEST_VERSION=.*/CLASHCTL_CHECK_LATEST_VERSION=0/' .env.install

      - name: Install system mode
        run: sudo bash install.sh --system --prefix "${CLASHCTL_SYSTEM_PREFIX}"

      - name: Verify custom system prefix
        run: |
          test "$(readlink -f /usr/local/bin/clashctl)" = "${CLASHCTL_SYSTEM_PREFIX}/bin/clashctl"
          grep -Fq "ExecStart=${CLASHCTL_SYSTEM_PREFIX}/scripts/run-mihomo" \
            /usr/local/lib/systemd/user/clashctl.service

      - name: Run multi-user isolation test
        run: sudo bash tests/integration/multi-user.sh

      - name: Remove system installation
        if: always()
        run: sudo bash uninstall.sh --system --prefix "${CLASHCTL_SYSTEM_PREFIX}" || true
